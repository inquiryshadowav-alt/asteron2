name: Build Game for Itch

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Package for itch.io
        run: npm run pack:itch

      - name: Upload playable game folder
        uses: actions/upload-artifact@v4
        with:
          name: itch-game
          path: dist/client

      - name: Upload itch.io zip
        uses: actions/upload-artifact@v4
        with:
          name: itch-game-zip
          path: dist/blockcraft-2d-itch.zip
